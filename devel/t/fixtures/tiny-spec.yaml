openapi: 3.0.0
info:
  title: Tiny
  version: '1.0'
paths:
  /things:
    post:
      operationId: createThing
      summary: Make a thing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Thing'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
components:
  schemas:
    Thing:
      type: object
      properties:
        name: { type: string }
        size: { type: integer, default: 10 }
